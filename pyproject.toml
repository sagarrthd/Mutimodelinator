[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodelinator"
version = "1.0.0"
description = "A fully offline multimodal AI generation tool."
readme = "README.md"
authors = [{ name = "Sagar R", email = "sagarrthd@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["offline-ai", "stable-diffusion", "multimodal", "gradio", "huggingface", "local-ai"]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "diffusers>=0.25.0",
    "transformers>=4.35.0",
    "accelerate>=0.25.0",
    "gradio>=4.0.0",
    "pillow>=10.0.0",
    "moviepy>=1.0.3",
    "safetensors>=0.4.0",
    "scipy>=1.10.0",
    "psutil>=5.9.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "xformers>=0.0.23",
    "einops>=0.7.0",
    "bitsandbytes>=0.41.0",
    "huggingface-hub>=0.20.0",
    "sentencepiece>=0.1.99",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-decouple>=3.8",
    "sqlalchemy>=2.0.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=6.0.0",
    "fastapi-mail>=1.4.1",
    "celery>=5.3.0",
    "locust>=2.20.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-requests",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/sagarrthd/Mutimodelinator"
Repository = "https://github.com/sagarrthd/Mutimodelinator.git"

[tool.setuptools]
packages = ["generators", "utils", "app"]
py-modules = ["config", "main", "main_enhanced"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
